name: Release

# Release publishing, driven entirely by release-please (kept separate from CI).
#
# Every push to main updates a release PR. Merging it cuts a DRAFT release + tag,
# which fans out to the publish job. The release is only made visible (undrafted,
# marked latest) once npm publish succeeds — so a failed publish never leaves a
# visible release without the matching npm version.
#
# To retry a failed publish: re-run the failed job. To redo a release end-to-end:
# delete the draft release + tag (`gh release delete <tag> --yes --cleanup-tag`),
# revert the release commit on main, and push — release-please re-opens the
# release PR; merging it rebuilds with the current workflow.

on:
  push:
    branches: [main]

# Never cancel an in-flight release; overlapping releases would race on tags/npm.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Locked down by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # No PAT: release-please opens its PR as github-actions[bot] with the
          # default GITHUB_TOKEN. GitHub creates the resulting pull_request CI
          # runs in an approval-required state — approve once via the PR's
          # "Approve workflows to run" banner (no long-lived credential).
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --- Publish to npm, then promote the draft release -----------------------
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node 24 bundles npm 11, required for OIDC trusted publishing. Keep this
      # workflow's filename stable — the npm-side trusted publishing config
      # pins it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # Authenticates via OIDC trusted publishing (id-token: write); no
      # NODE_AUTH_TOKEN needed. Runs prepublishOnly (check + build) first.
      - name: Publish to npm
        run: npm publish --access public
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --draft=false --latest
